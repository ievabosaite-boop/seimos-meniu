<!doctype html><html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#416b55"><link rel="manifest" href="manifest.webmanifest"><title>Šeimos meniu</title><style>body{font-family:system-ui;background:#f5f8f4;color:#243b2e;margin:0}header{background:#416b55;color:white;padding:20px}main{padding:12px;max-width:700px;margin:auto}.card{background:white;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0001}button,select,input{font:inherit;padding:9px;border:1px solid #cddacf;border-radius:9px;background:#e8f0e9;color:#284c36}button{cursor:pointer}.meal{padding:10px 0;border-bottom:1px solid #edf0ec;display:flex;justify-content:space-between;gap:8px;align-items:center}.meal span{flex:1}.muted{color:#66796c;font-size:12px}nav{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{margin:0;font-size:23px}h3{margin:0 0 8px}dialog{border:0;border-radius:16px;max-width:90vw;width:400px}dialog::backdrop{background:#0007}#choices button{display:block;width:100%;margin:5px 0;text-align:left}#foods{display:none}input{width:90%}</style><header><h1>🍲 Mano šeimos meniu</h1><small>Automatinė rotacija · lengvas pakeitimas</small></header><main><nav><button onclick="week--;render()">‹ Ankstesnė</button><strong id="period"></strong><button onclick="week++;render()">Kita ›</button></nav><div style="margin-top:12px"><button onclick="week=0;render()">Ši savaitė</button> <button onclick="toggleFoods()">Patiekalai</button> <button onclick="backup()">Atsarginė kopija</button></div><div id="days"></div><section id="foods" class="card"><h3>Patiekalų katalogas</h3><select id="category" onchange="renderFoods()"><option value="b">Pusryčiai</option><option value="l">Atsarginiai pietūs</option><option value="d">Vakarienės</option><option value="w">Vyro savaitgalio patiekalai</option></select><div id="foodList"></div><input id="newMeal" placeholder="Naujas patiekalas"><button onclick="addMeal()">Pridėti</button></section><p class="muted">Pakeitimai saugomi šiame įrenginyje. Reguliariai atsisiųsk atsarginę kopiją. Savaitgalio patiekalų sąrašas – preliminarus, jį gali redaguoti.</p></main><dialog id="dialog"><h3>Pakeisti patiekalą</h3><div id="choices"></div><input id="custom" placeholder="Arba įrašyk kitą"><button onclick="choose(document.getElementById('custom').value)">Išsaugoti</button><button onclick="dialog.close()">Uždaryti</button></dialog><script>
const defaults={b:['Avižinė košė','Miltiniai blynai su bananu','Kepti varškėčiai','Grūdėtos varškės ir avižų apkepas','Sorų košė','Omletas','Įdaryti kiaušiniai','Karšti sumuštiniai','Granola su jogurtu'],l:['Orkaitėje kepta lašiša','Kotletukai su ryžiais','Lęšiai su daržovėmis','Vištienos kepsneliai','Kesadilija su pupelėmis','Žuvies piršteliai','Sumuštiniai','Sriuba su vištiena ir makaronais'],d:['Vištienos blauzdelės','Kiaulienos plovas','Kotletukai su makaronais','Virtų bulvių cepelinai','Švilpikai','Naminė pica','Mėsainiai','Tortilijos su mėsa','Lazanija','Karbonadai','Spagečiai carbonara','Kugelis','Guliašas','Piemenėlių pyragas','Vištiena sūrio padaže','Vištienos bombos','Įdarytos bandelės','Picos bandelės','Chačapuris','Virtinukai su varške','Bulviniai blynai','Makaronai su edamame ir vištiena','Šonkauliukai','Menkė alaus tešloje'],w:['Mėsainiai','Naminė pica','Tortilijos su mėsa','Lazanija','Vištienos blauzdelės','Kugelis','Karbonadai','Įdarytos bandelės']};let saved;try{saved=JSON.parse(localStorage.getItem('familyMenu'))}catch(e){}let state=saved&&saved.foods?saved:{foods:defaults,changes:{}};let week=0,active=null;const save=()=>localStorage.setItem('familyMenu',JSON.stringify(state));function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function day(n){let d=monday(new Date());d.setDate(d.getDate()+7*week+n);return d}function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}function hash(s){let h=0;for(let c of s)h=(Math.imul(h,31)+c.charCodeAt(0))|0;return Math.abs(h)}function chooseAuto(type,d){let a=state.foods[type];return a.length?a[hash(key(d)+type)%a.length]:'Įrašyk patiekalą'}function meal(type,d){let k=key(d)+type;if(state.changes[k])return state.changes[k];if(type==='l'&&d.getDay()!==0&&d.getDay()!==6){let prev=new Date(d);prev.setDate(d.getDate()-1);return 'Vakarykščiai likučiai: '+meal('d',prev)}return chooseAuto(type==='l'&&(d.getDay()===0||d.getDay()===6)?'w':type==='d'&&(d.getDay()===0||d.getDay()===6)?'w':type,d)}function render(){document.getElementById('period').textContent=day(0).toLocaleDateString('lt-LT',{month:'short',day:'numeric'})+'–'+day(6).toLocaleDateString('lt-LT',{month:'short',day:'numeric'});let root=document.getElementById('days');root.innerHTML='';for(let i=0;i<7;i++){let d=day(i),box=document.createElement('div');box.className='card';let title=document.createElement('h3');title.textContent=d.toLocaleDateString('lt-LT',{weekday:'long',month:'short',day:'numeric'});box.append(title);for(let [type,label] of [['b','Pusryčiai'],['l','Pietūs'],['d','Vakarienė']]){let row=document.createElement('div');row.className='meal';let text=document.createElement('span');text.innerHTML='<small class="muted">'+label+'</small><div></div>';text.lastChild.textContent=meal(type,d);let btn=document.createElement('button');btn.textContent='Keisti';btn.onclick=()=>openChoices(type,d);row.append(text,btn);box.append(row)}root.append(box)}}function openChoices(type,d){active={type,d};let list=type==='b'?state.foods.b:type==='l'?state.foods.l:(d.getDay()===0||d.getDay()===6)?state.foods.w:state.foods.d;let root=document.getElementById('choices');root.innerHTML='';for(let name of list){let b=document.createElement('button');b.textContent=name;b.onclick=()=>choose(name);root.append(b)}if(type==='l'){let b=document.createElement('button');b.textContent='Palikti vakarykščius likučius';b.onclick=()=>{delete state.changes[key(d)+'l'];save();dialog.close();render()};root.prepend(b)}dialog.showModal()}function choose(name){if(!name.trim())return;state.changes[key(active.d)+active.type]=name.trim();save();dialog.close();render()}function toggleFoods(){let e=document.getElementById('foods');e.style.display=e.style.display==='block'?'none':'block';renderFoods()}function renderFoods(){let type=document.getElementById('category').value,root=document.getElementById('foodList');root.innerHTML='';for(let name of state.foods[type]){let row=document.createElement('div');row.className='meal';let span=document.createElement('span');span.textContent=name;let b=document.createElement('button');b.textContent='×';b.onclick=()=>{state.foods[type]=state.foods[type].filter(x=>x!==name);save();renderFoods();render()};row.append(span,b);root.append(row)}}function addMeal(){let e=document.getElementById('newMeal'),v=e.value.trim();if(v){state.foods[document.getElementById('category').value].push(v);e.value='';save();renderFoods();render()}}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='seimos-meniu.json';a.click();URL.revokeObjectURL(a.href)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></html>
